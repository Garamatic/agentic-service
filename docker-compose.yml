# Agentic Service Stack
# Includes the REST API + embedded LLM server (llama.cpp)
# Works standalone or connects to the existing demo infrastructure.

services:
  agentic-service:
    build: .
    ports:
      - "3001:3001"  # REST API
    environment:
      # Connect to existing services
      TICKET_API_URL: http://ticket-masala:8080
      ODOO_BRIDGE_URL: http://odoo-bridge:80

      # Authentication — set a strong secret in production
      API_KEY: ${API_KEY:-change-me-in-production}
      CORS_ORIGINS: "*"

      # RabbitMQ (same as your existing)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_VHOST: /

      # LLM — embedded llama.cpp server
      LLM_PROVIDER: llamacpp
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:2b-q4_K_M}
      LLM_BASE_URL: http://llama:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-llama}

      # Agent persistence — shared file so all processes see the same approvals
      AGENT_DB_PATH: /data/approvals.db

      # Logging
      LOG_LEVEL: INFO
    volumes:
      - agentic-data:/data
    networks:
      - garamatic-network
    depends_on:
      llama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "11434:8080"
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_CTX_SIZE=4096
    command: >
      -hf unsloth/Qwen3.5-2B-GGUF:UD-Q4_K_XL --alias qwen3.5:2b-q4_K_M
      -hf LiquidAI/LFM2.5-1.2B-Thinking-GGUF:Q4_K_M --alias lfm2.5:1.2b-thinking-q4_K_M
      --host 0.0.0.0
      --port 8080
      -c 4096
      --tools all
    networks:
      - garamatic-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agentic-mcp:
    build: .
    ports:
      - "3002:3001"  # MCP Server
    environment:
      # Connect to existing services
      TICKET_API_URL: http://ticket-masala:8080
      ODOO_BRIDGE_URL: http://odoo-bridge:8080

      # Authentication
      API_KEY: ${API_KEY:-change-me-in-production}
      TICKET_API_KEY: ${API_KEY:-change-me-in-production}
      CORS_ORIGINS: "*"

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_VHOST: /

      # LLM
      LLM_PROVIDER: llamacpp
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:2b-q4_K_M}
      LLM_BASE_URL: http://llama:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-llama}

      # MCP transport
      MCP_TRANSPORT: streamable-http

      # Agent persistence
      AGENT_DB_PATH: /data/approvals.db

      # Logging
      LOG_LEVEL: INFO
    volumes:
      - agentic-data:/data
    networks:
      - garamatic-network
    command: ["garamatic-mcp"]
    depends_on:
      llama:
        condition: service_started
      agentic-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  agentic-data:

networks:
  garamatic-network:
    external: true  # Connect to your existing network
